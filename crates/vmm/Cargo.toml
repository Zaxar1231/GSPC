[package]
name = "rustdroid-vmm"
description = "VMM RustDroid: vCPU, гостевая память, загрузчик ядра, прерывания, ACPI, PCI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
rustdroid-devices.workspace = true
rustdroid-gpu.workspace = true
rustdroid-virtio.workspace = true
rustdroid-whpx.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[dev-dependencies]
rustdroid-virtio = { workspace = true, features = ["test-utils"] }
