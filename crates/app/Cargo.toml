[package]
name = "rustdroid"
description = "RustDroid — Android-эмулятор для игр на Windows 11"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

build = "build.rs"

[[bin]]
name = "rustdroid"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
rustdroid-devices.workspace = true
rustdroid-gfxstream.workspace = true
rustdroid-gpu.workspace = true
rustdroid-input.workspace = true
rustdroid-present.workspace = true
rustdroid-instance.workspace = true
rustdroid-vmm.workspace = true
rustdroid-whpx.workspace = true
windows = { workspace = true, features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[lints]
workspace = true
