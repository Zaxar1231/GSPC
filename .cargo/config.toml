# Базовая цель — x86-64-v2 (SSE4.2/POPCNT): её поддерживает любой CPU, на котором работает Windows 11.
# Горячие участки дополнительно диспетчеризуются под AVX2 в рантайме (is_x86_feature_detected!).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2", "-C", "target-feature=+crt-static"]

[alias]
xtask = "run --package xtask --"
