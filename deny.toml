# cargo-deny: лицензии, уязвимости (RustSec, то же, что cargo-audit), источники, дубликаты.
[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Решение владельца (этап 7): снять, когда velopack обновит zip / derivative.
ignore = [
  { id = "RUSTSEC-2024-0388", reason = "derivative (velopack) не поддерживается, замены у velopack нет; только derive-макросы" },
  { id = "RUSTSEC-2026-0367", reason = "zip (velopack): через zip распаковываются только пакеты из подписанного ed25519 фида с проверкой SHA256 (rustdroid-updater); исправление — в zip новее, чем допускает velopack ^8.6" },
  { id = "RUSTSEC-2026-0368", reason = "zip (velopack): через zip распаковываются только пакеты из подписанного ed25519 фида с проверкой SHA256 (rustdroid-updater); исправление — в zip новее, чем допускает velopack ^8.6" },
