name: Release

# Тег vX.Y.Z → stable-релиз; vX.Y.Z-beta.N (любой тег с дефисом) → pre-release (канал beta).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Версия из тега
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $pre = if ($version.Contains('-')) { 'true' } else { 'false' }
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $core = $version.Split('-')[0]
          if ($cargo -ne $core -and $cargo -ne $version) {
            Write-Error "Версия в Cargo.toml ($cargo) не совпадает с тегом ($tag)"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$pre" >> $env:GITHUB_OUTPUT

      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Тесты
        run: cargo test --workspace --locked

      - name: Release-сборка
        run: cargo build --release --locked -p rustdroid

      # Подпись Authenticode. Включится сама, когда в секретах появятся
      # WINDOWS_CERT_PFX_BASE64 и WINDOWS_CERT_PASSWORD.
      - name: Подпись Authenticode
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:CERT_PASSWORD target\release\rustdroid.exe
          Remove-Item $pfx

      - name: Упаковка
        shell: pwsh
        run: |
          $v = "${{ steps.meta.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\rustdroid.exe dist\
          Copy-Item README.md, README.en.md, LICENSE-MIT, LICENSE-APACHE, CHANGELOG.md dist\
          Compress-Archive -Path dist\* -DestinationPath "RustDroid-$v-win-x64-portable.zip"
          Compress-Archive -Path target\release\rustdroid.pdb -DestinationPath "RustDroid-$v-win-x64-symbols.zip"
          Get-ChildItem RustDroid-*.zip | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt

      # Velopack: установщик Setup.exe, полный и дельта-пакет, фид releases.<канал>.json.
      # Фид и пакеты живут в pre-release `updates` (оттуда их берёт rustdroid-updater),
      # Setup.exe — ещё и в релизе версии. Канал: тег с дефисом — beta, иначе stable.
      - name: Velopack — установщик и пакеты обновлений
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:SIGNING_KEY) {
            Write-Error 'Нет секрета UPDATE_SIGNING_KEY: без подписи фида обновления не примутся'
            exit 1
          }
          $v = "${{ steps.meta.outputs.version }}"
          $channel = if ('${{ steps.meta.outputs.prerelease }}' -eq 'true') { 'beta' } else { 'stable' }
          $feed = 'https://github.com/${{ github.repository }}/releases/download/updates'
          dotnet tool install -g vpk
          New-Item -ItemType Directory -Force releases | Out-Null
          # Прошлый полный пакет канала — для дельты (в первый раз его нет).
          vpk download http --url $feed --channel $channel -o releases
          if ($LASTEXITCODE -ne 0) { Write-Host 'прошлых пакетов нет — только полный пакет' }
          # packId ≠ RustDroid: Velopack ставит в %LOCALAPPDATA%\<packId> и при удалении стирает
          # эту папку целиком, а в %LOCALAPPDATA%\RustDroid лежат образы и инстансы.
          vpk pack --packId RustDroidApp --packVersion $v --packDir dist --mainExe rustdroid.exe `
            --packTitle RustDroid --channel $channel -o releases
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Подпись фида ed25519 (ключ PEM из секрета).
          $key = Join-Path $env:RUNNER_TEMP 'update-key.pem'
          [IO.File]::WriteAllText($key, $env:SIGNING_KEY)
          $json = "releases/releases.$channel.json"
          openssl pkeyutl -sign -inkey $key -rawin -in $json -out "$json.sig"
          $signed = $LASTEXITCODE
          Remove-Item $key
          if ($signed -ne 0) { exit 1 }
          # Публикация фида и пакетов.
          gh release view updates *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create updates --prerelease --title 'Обновления (Velopack)' `
              --notes 'Фиды и пакеты автообновления RustDroid. Устанавливать — Setup.exe из релиза версии.'
          }
          $files = Get-ChildItem releases -File | Where-Object { $_.Name -like "RustDroidApp-$v-*" -or $_.Name -like "releases.$channel.json*" -or $_.Name -like 'assets.*.json' }
          gh release upload updates @($files.FullName) --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Имя установщика у vpk зависит от канала (…-Setup.exe / …-beta-Setup.exe).
          $setup = "RustDroid-$v-win-x64-Setup.exe"
          Copy-Item (Get-ChildItem releases -Filter '*Setup.exe' | Select-Object -First 1).FullName $setup
          "$((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower())  $setup" | Add-Content -Encoding ascii SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            RustDroid-*.zip
            RustDroid-*-Setup.exe
            SHA256SUMS.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-files

      - name: Changelog для версии
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "В CHANGELOG.md нет раздела [$VERSION]" >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@v3
        with:
          name: RustDroid ${{ needs.build.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          files: |
            RustDroid-*.zip
            RustDroid-*-Setup.exe
            SHA256SUMS.txt
